apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenCentral()

    // Official Mindustry plugin-template dependency layout.
    ivy {
        url = "https://github.com/"
        patternLayout {
            artifact "/[organisation]/[module]/releases/download/[revision]/dependencies.jar"
        }
        metadataSources {
            artifact()
        }
    }
}

java {
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

// The source contains UTF-8 characters (emoji, em-dashes). JDK 18+ defaults
// javac's source encoding to UTF-8, but JDK 17 uses the platform charset
// (windows-1252 here) and fails with "unmappable character". Pin it so the
// build works on any JDK, not just the VSCode-bundled 21.
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

ext {
    mindustryVersion = "v157.4"
}

dependencies {
    compileOnly "Anuken:Mindustry:$mindustryVersion"
    implementation "org.xerial:sqlite-jdbc:3.46.1.0"
}

jar {
    archiveFileName = "${project.name}.jar"

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    from(rootDir) {
        include "plugin.json"
    }
}
